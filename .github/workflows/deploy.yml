# 自动部署到 Cloudflare Pages
# 自建后台：Cloudflare D1（内容）+ R2（媒体），无 GitHub App / 无 Keystatic 依赖。
# 内容在构建期由 scripts/fetch-content.mjs 从 D1 拉取（或回退到已提交的 content.json 快照），
# 页面静态预渲染；后台「保存并发布」会触发 PAGES_DEPLOY_HOOK 重建以刷新静态页。
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 内联进前端的站点域名（canonical / sitemap / 绝对链接）
          PUBLIC_SITE_URL: https://tackix.pages.dev
          # 构建期从 D1 拉取可编辑内容（fetch-content.mjs）。
          # 未配置 token 时自动回退到已提交的 content.json 快照，构建永不中断。
          CLOUDFLARE_ACCOUNT_ID: b4f68b37b18c0891a0df46f3bf4d07f1
          D1_DB_NAME: tackix-content
          # D1_DATABASE_ID 留空则由 DB 名解析；配置后优先用 id 直连。
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b4f68b37b18c0891a0df46f3bf4d07f1
          command: pages deploy dist --project-name=tackix
