content:
  contactInfoTitle:
    zh: 联系方式
    en: Contact Information
  formSectionTitle:
    zh: 在线留言
    en: Send us a message
  pageTitle:
    zh: 联系我们
    en: Contact Sales
  pageSub:
    zh: 告诉我们您的基材、工况与产能，我们的技术团队将提供针对性的选型建议与报价。
    en: Tell us your substrates, operating conditions and volume — our engineers will recommend a grade and quote.
  formTitle:
    zh: 发送消息
    en: Send us a message
  formName:
    zh: 您的姓名
    en: Your name
  formEmail:
    zh: 商务邮箱
    en: Business email
  formMsg:
    zh: 您的应用场景
    en: Your application
  submit:
    zh: 发送询盘
    en: Send Enquiry
  success:
    zh: 感谢您的留言，我们会尽快回复。
    en: Thank you — your enquiry has been received. We will reply shortly.
  prelaunchTitle:
    zh: 本站尚未正式上线
    en: This site is not yet live
  prelaunchBody:
    zh: 在线表单暂时关闭，避免测试数据与真实询盘混淆。请通过邮件或 WhatsApp 直接联系我们。
    en: The online form is temporarily closed. Please reach us directly by email or WhatsApp.
  tipsTitle:
    zh: 留言时请包含
    en: What to include
tipsItems:
  - text:
      zh: 基材（如铝、钢、PC、FRP）
      en: Substrates (e.g. aluminium, steel, PC, FRP)
  - text:
      zh: 载荷类型与接头活动量
      en: Load type and joint movement
  - text:
      zh: 工作温度范围
      en: Operating temperature range
  - text:
      zh: 固化偏好与产线节拍
      en: Cure preference and line takt
  - text:
      zh: 认证要求（RoHS、REACH、UL 等）
      en: Certification requirements (RoHS, REACH, UL)
