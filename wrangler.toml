name = "tackix"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
# Keystatic 的 reader 用到 node:path / node:fs，Pages Functions 运行时需开启 nodejs_compat
compatibility_flags = ["nodejs_compat"]

# ============================================================
# Keystatic OAuth 会话依赖一个名为 SESSION 的 KV 命名空间。
# 在 Cloudflare Pages（Git 集成）模式下，KV 绑定【只】通过控制台 UI 配置：
#   Settings → Functions → KV namespace bindings → Add：
#   Variable name = SESSION，绑定你新建的 KV 命名空间
# 这里【不要】写 [[kv_namespaces]] —— Pages Git 模式不读取 toml 里的 KV 绑定，
# 且占位 id 会让 wrangler 部署阶段解析失败（这正是构建报错的一大根因）。
# ============================================================
