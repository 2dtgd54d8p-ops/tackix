# Tackix — Cloudflare Pages + D1 配置
# 取代原 Keystatic/GitHub 内容后端；内容编辑链路只依赖 Cloudflare。
#
# 注意（踩过的坑）：
# 1. Pages 项目的 wrangler.toml 不支持 account_id —— 写了会让 `wrangler pages deploy` 直接校验失败。
#    账号由 CI 的 accountId 参数或 `CLOUDFLARE_ACCOUNT_ID` 环境变量提供。
# 2. 不在此文件写 [vars]。环境变量/密钥（ADMIN_PASSWORD、SESSION_SECRET、GITHUB_DISPATCH_TOKEN 等）
#    统一在 Cloudflare Pages 控制台维护；写进 [vars] 有覆盖控制台配置的风险。
name = "tackix"
pages_build_output_dir = "dist"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# 生产 D1：全量内容库（content_entries / content_revisions + 选型域表 + submissions / visits）。
# 历史库 tackix-db(169af261…) 已并入本库，仅作冷备，不再绑定。
[[d1_databases]]
binding = "DB"
database_name = "tackix-content"
database_id = "6983915c-5ed7-4e64-be33-16c1d4da8498"
migrations_dir = "migrations"

# KV：反馈 + 邮件订阅共用（src/pages/api/feedback.ts、subscribe.ts，key 前缀 fb: / sub:）。
# 必须显式声明，否则带 wrangler.toml 的部署可能覆盖掉控制台里的既有绑定。
[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = "a4c32751980b47659adf481425e59bba"

# 媒体存储（R2 的免费替代，无需绑卡）：
# 后台 /api/media/upload 在 R2 未绑定时写入此 KV；/uploads/* 按 R2 → KV → ASSETS 三级回退读取。
# 限制：单文件 ≤ 25 MiB（KV value 上限）、总存量 1 GB（免费额度）、写入 1000 次/天。
# 值里存二进制，content-type 放在 metadata 里。
[[kv_namespaces]]
binding = "MEDIA_KV"
id = "e959f2b9958b41aca9d038eb4fe4f704"

# R2 媒体桶：账号未开通 R2 时**必须保持注释**，否则 `wrangler pages deploy` 会因桶不存在而失败（code 10042）。
# 媒体路由 src/pages/uploads/[...slug].ts 有静态资源回退（env.ASSETS），未绑 R2 也能正常出图。
# 将来开通 R2 后：`wrangler r2 bucket create tackix-media`，再解开下面三行并重新部署。
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "tackix-media"

# Vectorize：AI 问答 RAG 知识库索引（scripts/embed.mjs 灌入 embeddings，index 名 tackix-kb）。
# 说明：本项目锁定 @astrojs/cloudflare v12（wrangler 3.114），其 pages deploy 暂不支持把
# vectorize/ai 函数绑定写进 Pages deployment_config，故 src/pages/api/ask.ts 当前走「运行时
# REST 兜底」（env.CF_API_TOKEN 直连 Cloudflare API）。下方声明保留为未来升级 wrangler 后
# 直接启用函数绑定的兼容配置。
[[vectorize]]
binding = "VECTORIZE"
index_name = "tackix-kb"

# Workers AI：嵌入（@cf/baai/bge-base-en-v1.5）+ 生成（@cf/meta/llama-3.3-70b-instruct-fp8-fast）。
[ai]
binding = "AI"
