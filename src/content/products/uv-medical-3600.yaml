body: |
  ## 产品概述

  TAC UV-3600 是面向医疗器械领域的 UV 固化胶，兼顾快速固化与**低气味、低残留单体迁移**，
  满足一次性医疗器械对生物相容性与洁净度的要求。经 UV 照射数秒即可完成粘接固化，
  显著提升产线效率。

  ## 主要特性

  - UV 照射数秒固化，适合高速自动化装配
  - 低气味、低迁移，符合医疗级生物相容性要求
  - 胶层无色透明，可透过光线实现深层固化
  - 耐消毒（环氧乙烷/辐照灭菌）处理
  - 对 PC、PMMA 等透明基材 Excellent 粘接

  > 需紫外光源（建议 365nm）固化，固化条件与胶层厚度相关，厚件需延长照射时间或二次补照。

  ## 典型应用

  - 一次性输液器、留置针组件装配
  - 医疗管路接头、注射器零部件粘接
  - 医用面罩、护目镜透明件粘接
  - 试剂盒、诊断卡壳体封装
