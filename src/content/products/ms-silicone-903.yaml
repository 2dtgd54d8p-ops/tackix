nameEn: |
  TAC MS-903 Neutral-Cure Silicone Sealant
excerptEn: |
  Architectural neutral silicone sealant with 50% movement capability and outstanding weatherability for curtain wall, door/window and stone joints.
bodyEn: |
  ## Product Overview

  TAC MS-903 is a neutral-cure silicone structural sealant widely used in curtain wall and
  door/window systems. It offers excellent weather resistance, adhesion and movement
  capability. The elastic bead absorbs substrate thermal expansion and structural
  deformation, making it a critical sealing material for building envelopes.

  ## Key Features

  - Movement capability up to **±25%**, accommodating substrate deformation
  - Outstanding UV ageing resistance — no chalking or cracking outdoors
  - Strong adhesion to glass, aluminium, stone and metal
  - Neutral cure, non-corrosive to metals, low odour
  - Weather, water and cleaning-agent resistant

  ## Typical Applications

  - Curtain wall aluminium panel, glass and stone joint sealing
  - Aluminium and uPVC window/door frame-to-wall closing
  - Roofing, balcony and bathroom waterproof sealing
  - Stone cladding and metal panel joints

  > Design note: joint width and depth must be derived from the movement capability.
  > Use a backing rod to achieve two-sided adhesion and maximise movement absorption.
