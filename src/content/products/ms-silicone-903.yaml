body: |
  ## 产品概述

  TAC MS-903 是建筑幕墙与门窗系统常用的中性硅酮结构密封胶，具有优异的耐候性、
  粘附性与位移能力。通过弹性胶缝吸收基层热胀冷缩与结构变形，是幕墙与门窗系统
  密封的关键材料。

  ## 主要特性

  - 位移能力可达 **±25%**，适应基层变形与温度变化
  - Excellent 抗紫外老化，长期户外不粉化、不龟裂
  - 对玻璃、铝、石材、金属等基材粘附力强
  - 中性固化，不腐蚀金属，无刺激性气味
  - 耐候、耐水、耐清洁剂

  ## 典型应用

  - 建筑幕墙铝单板、玻璃、石材接缝密封
  - 铝合金门窗、塑钢窗框扇与墙体收口
  - 屋面、阳台、卫生间防水密封
  - 石材干挂与金属板接缝

  > 施工建议：接缝宽度与深度需按位移能力设计，必要时使用背衬材料形成
  > 双向粘结，以最大化位移吸收效果。

