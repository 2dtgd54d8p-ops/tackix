body: |
  ## 产品概述

  TAC UV-3200 是一款低收缩、高透明的紫外光固化胶，面向电子封装与精密组装的
  **快速定位与密封**需求。在 365–405 nm 紫外光下数秒内完成初固，适合产线批量作业。

  ## 主要特性

  - 极低收缩率，避免光学元件与精密结构位移
  - 高透光率，适用于透镜、显示屏封边
  - 固化速度快，显著提升节拍效率
  - 通过 UL 认证，满足电子行业安规要求

  ## 典型应用

  - 手机/平板摄像头模组固定
  - 玻璃盖板与金属中框粘接
  - PCB 元件保护与补强

