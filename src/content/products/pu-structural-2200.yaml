body: |
  ## 产品概述

  TAC PU-2200 是双组分聚氨酯结构胶，在保持结构强度的同时具备优异的弹性和抗冲击能力，
  特别适合**存在热胀冷缩位移、需要吸收振动与形变**的接缝。相较于刚性环氧胶，
  聚氨酯胶层可随基材同步变形，显著降低界面应力与开裂风险。

  ## 主要特性

  - 高弹性（伸长率可达 200% 以上），适应动态位移
  - 低温韧性优异，-50℃ 环境下仍保持有效粘接
  - 抗撕裂、耐磨耗，可承受长期往复运动
  - 可打磨/涂装，胶缝外观与周围基材协调
  - 室温固化，亦可加热加速固化

  ## 典型应用

  - 汽车门板、顶棚与车身的钣金/蒙皮粘接
  - 建筑幕墙铝单板接缝密封与结构连接
  - 轨道交通车辆内饰板与密封条固定
  - 集装箱、车厢体面板的柔性连接
