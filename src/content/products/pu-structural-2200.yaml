nameEn: |
  TAC PU-2200 Two-Component Polyurethane Structural Adhesive
excerptEn: |
  Flexible weather-resistant polyurethane structural adhesive that absorbs dynamic movement while maintaining structural strength.
bodyEn: |
  ## Product Overview

  TAC PU-2200 is a two-component polyurethane structural adhesive that combines structural
  strength with high elasticity and impact resistance. It is designed for joints subject to
  **thermal expansion, vibration and deformation** — the adhesive layer deforms with the
  substrate, relieving interfacial stress and preventing cracking.

  ## Key Features

  - High elasticity (elongation above 200%) to absorb movement
  - Excellent low-temperature toughness, effective down to -50°C
  - Tear and abrasion resistant for repeated movement
  - Paintable and sandable for cosmetic finishes
  - Room-temperature cure or heat-accelerated

  ## Typical Applications

  - Automotive door panels, roof and body sheet bonding
  - Building curtain wall panel joints and structural sealing
  - Rail transit interior panels and seal fixing
  - Container and vehicle body panel flexible connections
