nameEn: |
  TAC CR-610 Anaerobic Threadlocker
excerptEn: |
  Medium-strength anaerobic threadlocker forming a high-strength anti-loosening film that prevents thread seizure and micro-leakage under vibration.
bodyEn: |
  ## Product Overview

  TAC CR-610 is an anaerobic threadlocker. Applied to threads, it cures in the absence of
  air (metal-to-metal contact) to form a tough film that prevents loosening under vibration
  and also seals micro-porosity against leakage.

  ## Key Features

  - Prevents thread loosening and resists vibration fatigue
  - Removable — medium strength, serviceable with standard tools
  - Resistant to oils, chemical media and extreme temperatures
  - Low viscosity penetrates thread micro-pores, sealing as well as locking

  > Available in low, medium, high strength and permanent versions.
  > This product is the **medium-strength removable** type.

  ## Typical Applications

  - Anti-loosening of engine, chassis and steering fasteners
  - Machine tool and mould installation bolts
  - Instrument and optical equipment focus ring fixing
  - General industrial thread sealing and leak prevention
