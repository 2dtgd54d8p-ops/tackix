body: |
  ## 产品概述

  TAC CR-610 是厌氧型螺纹锁固胶，涂覆于螺纹后在隔绝空气（金属接触）环境下固化，
  形成坚韧的胶层，有效防止螺纹在振动工况下松动，并可作为微孔泄漏的密封手段。

  ## 主要特性

  - 防止螺纹松动，抵抗振动疲劳
  - 可拆卸（中强度，可用常规工具拆解）
  - 耐油、耐化学介质、耐高低温
  - 低粘度可渗入螺纹微孔，兼具密封防漏效果

  > 按强度可分为低/中/高强度及永久锁固型，本产品为**中强度可拆卸**型。

  ## 典型应用

  - 汽车发动机、底盘、转向系统螺纹紧固件防松
  - 机械加工设备、模具安装螺栓锁固
  - 仪器仪表、光学设备调焦环固定
  - 通用工业装配的螺纹密封与防漏
