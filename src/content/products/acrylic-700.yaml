body: |
  ## 产品概述

  TAC AL-700 是单组分丙烯酸酯结构胶，兼顾较快的粘接速度与良好的结构强度。
  对于涂装金属、部分工程塑料可实现**免底涂**快速粘接，有效简化工艺流程。

  ## 主要特性

  - 粘接速度快，可显著缩短工艺节拍
  - 对涂装金属、常见塑料基材粘接良好
  - 低气味，施工环境友好
  - 耐水、耐候、耐老化

  > 特殊基材（PE/PP 等低表面能材料）需先做电晕或等离子活化处理。

  ## 典型应用

  - 电子产品塑料外壳与内部支架装配
  - 汽车内饰件、饰条的快速固定
  - 家电、办公设备外壳粘接
  - 展示架、灯箱等非承力装配
