nameEn: |
  TAC AL-700 One-Component Acrylic Adhesive
excerptEn: |
  Low-odour one-component acrylic adhesive with fast bond strength and primer-free adhesion to plastics and painted metals.
bodyEn: |
  ## Product Overview

  TAC AL-700 is a one-component acrylic adhesive that balances fast bond strength with good
  structural performance. It achieves **primer-free** bonding to painted metals and many
  engineering plastics, simplifying the process flow.

  ## Key Features

  - Fast bonding speed to shorten cycle time
  - Good adhesion to painted metals and common plastics
  - Low odour, operator-friendly
  - Resistant to water, weather and ageing

  > Low-surface-energy substrates such as PE and PP require corona or plasma
  > activation prior to bonding.

  ## Typical Applications

  - Plastic housings and internal brackets in electronics
  - Automotive interior trim fixing
  - Appliance and office equipment housing assembly
  - Display stands and signage (non-structural)
