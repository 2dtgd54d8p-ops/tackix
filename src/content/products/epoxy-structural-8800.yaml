body: |
  ## 产品概述

  ABRO 8800 是一款高韧性双组分环氧树脂结构胶，专为汽车制造、轨道交通与通用工业中的
  **承重结构粘接**而设计。固化后形成坚韧、耐冲击的胶层，可替代部分机械紧固，减轻
  装配重量并提升整体密封性。

  ## 主要特性

  - 高剪切与剥离强度，适合动态载荷场景
  - 对金属、复合材料（FRP、碳纤维）附着力优异
  - 耐油、耐化学介质，适应严苛工况
  - 室温固化，亦可加热加速（60℃ / 30 min）

  ## 典型应用

  - 汽车车身结构件、电池包外壳粘接
  - 新能源储能箱体密封与固定
  - 工业设备金属框架的结构装配

