nameEn: |
  ABRO 8800 Two-Component Epoxy Structural Adhesive
excerptEn: |
  High-toughness two-component epoxy structural adhesive for load-bearing assembly of metals and composites.
bodyEn: |
  ## Product Overview

  ABRO 8800 is a high-toughness two-component epoxy structural adhesive engineered for
  **load-bearing structural bonding** in automotive, rail transit and general industrial
  assembly. Once cured it forms a tough, impact-resistant adhesive layer that can replace
  selected mechanical fasteners, reducing assembly weight while improving sealing integrity.

  ## Key Features

  - High shear and peel strength, suitable for dynamic load conditions
  - Excellent adhesion to metals and composites (FRP, carbon fibre)
  - Resistant to oils and chemical media for harsh operating environments
  - Room-temperature cure, or heat-accelerated (60°C / 30 min)

  ## Typical Applications

  - Automotive body structural parts and battery pack housing bonding
  - New-energy storage enclosure sealing and fastening
  - Structural assembly of industrial equipment metal frames
