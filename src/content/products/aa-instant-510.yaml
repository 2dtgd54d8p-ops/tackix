body: |
  ## 产品概述

  TAC AA-510 是低粘度氰基丙烯酸酯（瞬干胶），在常温下接触湿气即可在数秒内完成固化，
  粘接速度快、胶层无色透明且基本无痕，适用于**小面积、高精度的快速装配与修补**。

  ## 主要特性

  - 秒级固化，生产节拍友好
  - 低粘度可渗入细小缝隙，填充性好
  - 胶层无色透明，不影响外观件
  - 对橡胶、塑料、金属、玻璃均有良好粘接

  ## 使用注意事项

  > 瞬干胶不适用于大面积承重结构粘接，也不适合长期处于潮湿或高温环境。
  > 大面积或结构件请改用环氧/聚氨酯结构胶。

  ## 典型应用

  - 电子装配中的元件定位与补焊固定
  - 塑料件、橡胶密封圈的快速修补
  - 仪器仪表、玩具、工艺品的小件装配
  - 手工艺品与模型的高精度粘接
