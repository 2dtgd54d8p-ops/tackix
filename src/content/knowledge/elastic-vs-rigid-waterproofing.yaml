title: elastic-vs-rigid-waterproofing
name:
  zh: 弹性防水胶与刚性防水胶怎么选
  en: Elastic vs rigid waterproofing adhesive
excerpt:
  zh: 有裂缝、会变形的部位用弹性防水；结构稳定、需贴砖或受踩踏的用刚性。常二者复合：刚性打底、弹性封面。
  en: >-
    Use elastic where there are cracks and movement; rigid where the structure is stable and tiled or walked on. Often
    combine: rigid base, elastic top.
    Need a product recommendation or technical data for your job? See the [scenario solution](/solutions/roof-waterproof) or use the [selector tool](/selector) to match by substrate and conditions.
