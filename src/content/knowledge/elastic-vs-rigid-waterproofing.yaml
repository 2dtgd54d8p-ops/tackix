faq:
  - question:
      zh: 能不能只刷刚性防水？
      en: Can I just use rigid waterproofing?
    answer:
      zh: 若基层有细微裂缝或会沉降，纯刚性易开裂失效；建议弹性覆盖裂缝区，或刚性打底+弹性面层复合。
      en: >-
        On cracked or settling substrates, rigid alone cracks and fails; cover crack zones elastically, or use a rigid
        base with an elastic topcoat.
