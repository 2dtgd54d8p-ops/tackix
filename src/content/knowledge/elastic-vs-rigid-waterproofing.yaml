body:
  zh: >-
    弹性与刚性不是优劣之分，而是分工不同。**弹性防水**（聚氨酯、JS
    高弹、丙烯酸弹性涂料、硅酮胶）能拉伸回弹，专治会变形的裂缝、伸缩缝、管根节点；缺点是强度较低、多数不耐长期踩踏、部分怕紫外线需覆护层。**刚性防水**（水泥基渗透结晶、刚性防水砂浆）强度高、耐踩、易贴砖，但几乎不跟随变形，基层一裂就跟着裂。


    **工程上常复合使用**：结构稳定区用刚性打底找平，变形缝、管根、阴阳角等节点用弹性材料加强并外覆胎体。选材料时还要看基层类型（混凝土/金属/卷材）、是否外露、是否上人。
    需要针对你的工况选型或索取技术资料？查看[场景方案](/solutions/roof-waterproof)，或用[选型工具](/selector)按基材与环境快速匹配。
  en: >-
    Elastic and rigid are not better-or-worse, they divide the labour. **Elastic** (PU, high-elastic JS, acrylic
    elastomeric, silicone) stretches and recovers — ideal for moving cracks, expansion joints and pipe penetrations —
    but is weaker, mostly not walkable, and some need a UV-protective cover. **Rigid** (crystalline, rigid waterproof
    mortar) is strong, walkable and tile-friendly but follows no movement, so it cracks with the substrate. In practice
    they combine: a rigid base on stable areas, with elastic reinforcement and a carrier over joints, corners and
    penetrations. Also match the material to the substrate (concrete/metal/membrane), exposure and whether it is
    trafficked.
