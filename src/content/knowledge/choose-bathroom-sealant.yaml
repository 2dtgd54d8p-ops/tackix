faq:
  - question:
      zh: 浴室能用普通玻璃胶吗？
      en: Can I use ordinary glass sealant in a bathroom?
    answer:
      zh: 不建议。酸性玻璃胶耐水性差、易发黄发霉；浴室应选中性防霉硅酮密封胶，尤其淋浴区与台盆接缝。
      en: >-
        Not recommended. Acidic glass sealant resists water poorly and yellows/moulds; use a neutral, mould-resistant
        silicone, especially in showers and around basins.
steps: []
body:
  zh: >-
    浴室选密封胶，先看三个硬指标。第一是**耐水性**：接缝长期浸水，必须选可长期浸水的产品，否则会乳化失效。第二是**防霉等级**：优先选明确标注防霉 0 级 / A
    级并含防霉剂的中性硅酮胶。第三是**位移能力**：温湿度变化与轻微沉降需要 ≥20% 位移能力的柔性胶。


    淋浴房、浴缸、台盆、马桶底座等长期潮湿部位，统一用中性防霉硅酮密封胶；若接缝较宽或需上漆，再考虑改性硅烷（MS）类产品。施工前务必把旧胶彻底清除、基材干燥无尘，否则再好的胶也粘不牢。
  en: >-
    Pick bathroom sealant on three hard criteria. First, **water resistance**: joints stay immersed, so choose a product
    rated for continuous water exposure or it will emulsify. Second, the **mould rating**: prefer a neutral silicone
    explicitly rated mould-resistant (Class 0 / Grade A) with an anti-mould additive. Third, **movement capability**:
    humidity swings and minor settling demand a flexible sealant with ≥20% movement. Use neutral mould-resistant
    silicone for showers, tubs, basins and toilet bases; consider MS polymer for wide or paintable joints. Always remove
    old sealant completely and keep the substrate clean and dry.
