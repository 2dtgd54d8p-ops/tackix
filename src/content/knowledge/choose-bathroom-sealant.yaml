title: choose-bathroom-sealant
name:
  zh: 浴室密封胶怎么选
  en: How to choose a bathroom sealant
excerpt:
  zh: 浴室长期潮湿、接触水和清洁剂的接缝，选错胶会发黑发霉、漏水。按耐水性、防霉等级和位移能力三要素来选。
  en: >-
    Wet, water- and cleaner-exposed bathroom joints fail fast if the wrong sealant is used. Choose by water resistance,
    mould rating and movement capability.
