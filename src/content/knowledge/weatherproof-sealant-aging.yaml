title: weatherproof-sealant-aging
name:
  zh: 耐候胶老化怎么判断
  en: How to judge weatherproof sealant aging
excerpt:
  zh: 户外耐候胶老化表现为粉化、龟裂、脱粘、变色。出现这些迹象就应计划更换，避免渗水扩大。
  en: >-
    Aged outdoor weatherproofing shows as chalking, cracking, loss of adhesion or discolouration. These signs mean plan
    a replacement before leaks spread.
