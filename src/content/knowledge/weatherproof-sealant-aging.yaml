body:
  zh: >-
    耐候胶老化是可预判的，定期目视检查能避免突发渗水。四个典型信号：**粉化**——胶面发白、用手一搓掉粉，说明有机组分已降解；**龟裂**——出现细裂纹，是位移超限或配方耐候不足；**脱粘**——胶与基材边缘分离、能掀起，失去密封；**变色/流油**——发黄出油多为劣质或过期产品。


    判断原则：仅表面粉化、未漏水可暂观察并记录；一旦龟裂或脱粘，雨水会沿缝隙进入结构层，应尽快整条铲除重打。户外耐候胶建议寿命 5–10 年，临海、强紫外线地区要更频繁检查。
    需要针对你的工况选型或索取技术资料？查看[场景方案](/solutions/window-door-leak)，或用[选型工具](/selector)按基材与环境快速匹配。
  en: >-
    Weatherproofing aging is predictable; routine visual checks prevent sudden leaks. Four signals: **chalking** — a
    white, powdery surface means the polymer is degrading; **cracking** — fine fissures from exceeding movement limits
    or poor weather resistance; **loss of adhesion** — the bead lifts at the edges, seal broken;
    **discolouration/bleeding** — yellowing or oil suggests low quality or expired product. Rule of thumb: surface
    chalking without leakage can be monitored and logged; once cracking or detachment appears, water reaches the
    structure, so cut out and re-bead the whole joint promptly. Expect 5–10 years outdoors; inspect more often near
    coast or intense UV.
