faq:
  - question:
      zh: 轻微粉化要马上换吗？
      en: Must I replace on slight chalking?
    answer:
      zh: 表面轻微粉化尚不漏水可暂观察，但已说明胶层在退化；若出现龟裂或脱粘则应尽快更换。
      en: >-
        Slight surface chalking without leakage can be watched, but it signals degradation; replace promptly if cracking
