title: tile-grout-material-comparison
name:
  zh: 瓷砖填缝材料对比
  en: Tile grout material comparison
excerpt:
  zh: 水泥基、环氧、美缝剂各有适用场景。厨卫湿区优先环氧类防霉防水，干区可用改性水泥基。
  en: >-
    Cementitious, epoxy and decorative grouts each fit different jobs. Use epoxy in wet kitchen/bath zones; modified
    cementitious is fine in dry areas.
