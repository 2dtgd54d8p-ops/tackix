faq:
  - question:
      zh: 环氧填缝贵，值得吗？
      en: Epoxy grout is pricey — is it worth it?
    answer:
      zh: 湿区值得。环氧不吸水、防霉抗污、寿命长，省下后期翻新和发霉处理的成本。
      en: >-
        In wet zones, yes. Epoxy is non-absorbent, mould- and stain-resistant and long-lived, saving later renovation
        and mould-remediation cost.
