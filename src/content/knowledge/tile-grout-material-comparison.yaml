body:
  zh: >-
    常见填缝材料三类。**普通水泥基填缝剂**便宜、易施工，但吸水率高、易渗色发霉，只适合室内干区。**改性水泥基（加聚合物）**
    抗渗性更好，仍属水泥体系，湿区寿命有限。**环氧填缝剂**由环氧树脂+固化剂组成，几乎不吸水、防霉抗污、强度高，是厨卫湿区、淋浴房的首选，代价是价格高、施工窗口短、需及时清理。


    **选型建议**：淋浴房、台面后挡水、地漏周边用环氧；客厅、卧室干区用改性水泥基即可；户外或温差大区域还要关注抗冻融与位移能力。
    需要针对你的工况选型或索取技术资料？查看[场景方案](/solutions/tile-grout)，或用[选型工具](/selector)按基材与环境快速匹配。
  en: >-
    Three common grout families. **Plain cementitious** is cheap and easy but absorbs water and stains/moulds — dry
    indoor areas only. **Polymer-modified cementitious** resists penetration better yet remains cement-based with
    limited wet-zone life. **Epoxy** (resin + hardener) is nearly non-absorbent, mould- and stain-resistant and strong —
    the first choice for wet kitchen/bath zones and showers, at higher cost, shorter open time and needing prompt
    cleanup. Recommendation: epoxy around showers, basins and floor drains; modified cementitious for dry living areas;
    for outdoors or high temperature swing, also check freeze-thaw and movement resistance.
