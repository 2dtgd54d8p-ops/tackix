title: high-temp-humidity-application
name:
  zh: 高温高湿环境施工要点
  en: Application notes for high-temperature, high-humidity conditions
excerpt:
  zh: 夏季屋面高温、南方回南天高湿，防水施工易起泡、不固化。控温、避午、除湿、选对材料是关键。
  en: >-
    Hot summer roofs and humid southern conditions cause bubbling and non-curing. Control temperature, avoid midday,
    dehumidify and pick the right product.
