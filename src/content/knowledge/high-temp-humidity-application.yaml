faq:
  - question:
      zh: 回南天能刷防水吗？
      en: Can I apply waterproofing during humid "returning-spring" days?
    answer:
      zh: 高湿会拖慢固化、引发发粘起泡，建议等湿度下降或改用湿固化型材料并加强通风除湿。
      en: >-
        High humidity slows curing and causes tackiness/bubbling; wait for lower humidity or use a moisture-curing
        product with ventilation and dehumidification.
