scenario: kitchen-bath-mould
faq:
  - question:
      zh: 防霉胶为什么还是发霉了？
      en: Why did the mould-resistant sealant still mould?
    answer:
      zh: 多半是基材未干透或旧霉未除净。防霉剂作用于胶层本身，若底层藏霉、有水，表面仍会滋生。
      en: >-
        Usually the substrate was not dry or old mould was left behind. The additive protects the bead itself; mould
        underneath or in water still grows.
steps: []
body:
  zh: >-
    防霉胶不是「打了就一定不霉」，它只在胶层自身抑制霉菌，前提是施工到位。**第一坑：基材潮湿就施工**——胶底不固化、易脱粘。务必等基材含水率达标、表面无明水。**第二坑：旧霉未除净**——直接在发霉旧胶上覆盖新胶，底层霉菌会穿透。**第三坑：胶层过厚或凹陷**——过厚内部难固化，凹陷处积水成霉窝，应刮平呈微凸弧形。**第四坑：不贴美纹纸**——边缘毛糙藏污，建议贴纸后打胶再撕。
  en: >-
    Mould-resistant sealant is not a guarantee; it only inhibits mould within the bead, and only if applied correctly.
    Pitfall 1: sealing a damp substrate — the base never cures and detaches. Pitfall 2: covering old mould — it grows
    through. Pitfall 3: a bead that is too thick or concave — thick beads cure poorly inside, concave ones pool water;
    tool it to a slight convex arc. Pitfall 4: skipping masking tape — ragged edges trap grime; tape, bead, then peel.
