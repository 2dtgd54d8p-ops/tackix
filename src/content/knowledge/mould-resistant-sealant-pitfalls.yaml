title: mould-resistant-sealant-pitfalls
name:
  zh: 防霉胶施工避坑
  en: Pitfalls when applying mould-resistant sealant
excerpt:
  zh: 再好的防霉胶，施工不当也会短期内发霉脱落。避开基材潮湿、胶层过厚、未贴美纹纸等常见坑。
  en: >-
    Even the best mould-resistant sealant fails early if applied badly. Avoid damp substrates, overly thick beads and
    skipping masking tape.
