faq:
  - question:
      zh: 防霉填缝剂还发霉怎么办？
      en: The "mould-resistant" grout still moulded — why?
    answer:
      zh: 可能是表面孔隙藏污或长期不清洁。防霉针对胶材本身，仍需保持通风与定期清洁，严重发黑建议换环氧。
      en: >-
        Possibly surface soiling in pores or poor cleaning. The additive protects the material itself; ventilation and
        cleaning still matter. For severe blackening, switch to epoxy.
steps: []
body:
  zh: >-
    长期潮湿环境（地下室、泳池边、无窗淋浴）填缝的关键是**低吸水 + 防霉**。普通水泥基填缝吸水藏污，几个月就发黑；环氧填缝几乎不吸水、自带防霉抗污，是这类环境的最优选。


    **施工避坑**：潮湿环境对固化影响大——环氧在低温高湿下固化慢、易发粘沾灰，施工前务必除湿、控温（建议 10–30℃、相对湿度
    <80%），并在开放时间内及时擦净溢料。填缝前基层要坚实、无明水、无白华（返碱），否则粘结与防霉效果都会打折。
  en: >-
    In permanently damp places (basements, pool edges, windowless showers) the key is low absorption plus mould
    resistance. Cementitious grout wicks water and soils within months; epoxy barely absorbs and is inherently mould-
    and stain-resistant, making it the top choice. Pitfalls: damp conditions hurt curing — epoxy slows and gets tacky in
    cold, humid air, so dehumidify and control temperature (≈10–30°C, RH <80%) and wipe squeeze-out within the open
    time. The substrate must be sound, free of standing water and efflorescence, or both adhesion and mould resistance
    suffer.
