title: damp-grouting-mould-resistant
name:
  zh: 潮湿环境防霉填缝
  en: Mould-resistant grouting in damp environments
excerpt:
  zh: 地下室、泳池、淋浴等长期潮湿处，填缝必须低吸水、含防霉剂。环氧类最稳妥，施工要控温除湿。
  en: >-
    Basements, pools and showers stay damp; grout must be low-absorption with anti-mould additive. Epoxy is safest —
    control temperature and humidity during application.
