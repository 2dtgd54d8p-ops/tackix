title: metal-frame-concrete-wall-sealant
name:
  zh: 金属窗框与水泥墙怎么选胶
  en: Sealant for metal window frames against concrete walls
excerpt:
  zh: 金属框与水泥墙热胀冷缩差异大、缝隙易开裂漏水。应选高位移能力、粘结力强、耐候的中性硅酮耐候胶。
  en: >-
    Metal frames and concrete move differently and crack at the joint. Use a high-movement, strongly bonding,
    weather-resistant neutral silicone.
