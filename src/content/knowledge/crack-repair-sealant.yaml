scenario: roof-waterproof
faq:
  - question:
      zh: 所有裂缝都能用弹性胶吗？
      en: Can every crack use elastic sealant?
    answer:
      zh: 动裂（随温差开合）必须弹性胶；但正在扩大的结构裂缝应先做结构补强，再封缝，否则胶会被拉开。
      en: >-
        Moving (thermal) cracks need elastic sealant, but an actively widening structural crack must be reinforced
        first, or the sealant will simply be pulled apart.
