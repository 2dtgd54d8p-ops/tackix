title: crack-repair-sealant
name:
  zh: 屋顶裂缝补漏选什么胶
  en: What sealant to choose for roof crack repair
excerpt:
  zh: 屋顶裂缝补漏要先分静裂还是动裂。动裂用高弹性聚氨酯/硅酮，静裂可用刚性防水涂料封闭。
  en: >-
    Roof crack repair starts by telling static from moving cracks. Use high-elasticity PU/silicone for moving cracks;
    rigid coating seals static ones.
publishedAt: '2026-10-15'
