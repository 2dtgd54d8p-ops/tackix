title: '建筑幕墙铝单板接缝密封'
excerpt: '以中性硅酮结构密封胶替代传统发泡与打胶工艺，解决幕墙接缝渗漏与位移开裂问题。'
published: true
featured: true
scenario: 'construction'
client: '某东南亚高层建筑幕墙承包商'
challenge: |
  该项目位于热带高温高湿气候区，幕墙铝单板接缝在温循环与风荷载作用下位移显著。
  传统密封材料存在渗漏、霉变与老化开裂问题，影响外墙观感与防水耐久性。
solution: |
  选用 TAC MS-903 中性硅酮结构密封胶配合背衬材料形成双向粘结结构，
  利用其 ±25% 位移能力吸收基层变形，打胶工艺配套双面胶控制胶缝厚度。
result: |
  工程通过当地 60 年重现期风压与防水试验，接缝渗漏问题零发生，
  胶缝历经热带气候考验无霉变与开裂，获甲方与监理一致认可。
products:
  - ms-silicone-903
body: |
  ## 背景

  高层建筑幕墙对密封体系的位移适应性与耐候性要求极高。本项目地处热带高温高湿
  气候区，昼夜温差大、紫外线强，对接缝密封材料构成严峻考验。

  ## 方案与验证

  选型 **TAC MS-903 中性硅酮结构密封胶**，施工中严格控制三要素：

  1. 接缝设计：按位移能力反推接缝宽度与深度
  2. 背衬材料：安装闭孔背衬棒形成双向粘结，放大位移吸收
  3. 胶缝控制：打胶时控制厚度与打胶速度，避免气泡与虚边

  ## 价值

  结构胶的双向粘结设计有效放大了胶缝的位移吸收能力，使接缝在风压与温度变形下
  保持完整密封，显著提升幕墙整体防水耐久性。

# ── 英文内容（T12）──
titleEn: 'Curtain Wall Aluminium Panel Joint Sealing'
excerptEn: |
  Neutral silicone structural sealant replaces conventional foam-and-bead methods, resolving leakage and displacement cracking in curtain wall joints.
challengeEn: |
  This project is located in a tropical high-temperature, high-humidity climate where curtain wall aluminium panel joints experience significant movement under thermal cycling and wind load. Conventional sealants suffered leakage, mould growth and ageing cracks, affecting appearance and waterproof durability.
solutionEn: |
  TAC MS-903 neutral silicone structural sealant was applied with backing rod to form a two-sided adhesive joint, using its ±25% movement capability to absorb substrate deformation. Bead thickness was controlled with double-sided tape during application.
resultEn: |
  The project passed the local 60-year return-period wind pressure and waterproofing tests with zero joint leakage. Joints showed no mould growth or cracking through tropical climatic exposure, with full acceptance from both client and supervisor.
bodyEn: |
  ## Background

  High-rise curtain walls place extreme demands on sealant movement capability and weather resistance. This project sits in a tropical climate with large day-night temperature swings and strong UV, which is severely testing for joint sealants.

  ## Solution and validation

  **TAC MS-903 neutral silicone structural sealant** was specified with three construction controls:

  1. Joint design: width and depth derived from movement capability
  2. Backing material: closed-cell backing rod installed to achieve two-sided adhesion and amplify movement absorption
  3. Bead control: application speed and thickness controlled to avoid voids and concave edges

  ## Value

  The two-sided adhesive design of the structural sealant effectively amplified the movement absorption of the bead, keeping joints fully sealed under wind pressure and thermal deformation, and substantially improving the curtain wall waterproof durability.
