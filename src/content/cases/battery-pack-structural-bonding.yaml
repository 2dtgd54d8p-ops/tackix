title: '新能源汽车电池包壳体结构粘接'
excerpt: '以双组分环氧结构胶替代部分焊接与机械紧固，提升电池包壳体的密封性、疲劳寿命与轻量化水平。'
published: true
featured: true
scenario: 'newenergy'
client: '某新能源电池系统厂商'
challenge: |
  电池包下壳体由铝型材与 CFRP 上盖拼装，传统焊接存在热变形、密封不良与工序能耗高的问题；
  同时需要兼顾导热、绝缘与长期振动工况下的结构可靠性。
solution: |
  采用 ABRO 8800 双组分环氧结构胶进行型材与上盖的结构粘接，配合点焊定位；
  通过调整涂布厚度控制装配公差，室温固化后形成耐冲击、耐油的连续胶层，兼顾密封与结构承载。
result: |
  装配工序减少 2 道，壳体气密测试通过率提升至 99.5%，减重约 8%，
  并通过 300 万次振动疲劳验证。
products:
  - epoxy-structural-8800
body: |
  ## 背景

  在新能源汽车电池包的制造中，壳体（下箱体 + 上盖）的密封与结构强度直接关系到电池系统的
  安全与寿命。该客户原工艺以焊接 + 机械紧固为主，面临以下痛点：

  - 铝合金与 CFRP 异种材料焊接困难，热输入导致型材变形
  - 焊缝周边密封胶施工复杂，气密测试返修率高
  - 装配工序多、能耗高，不利于节拍与成本控制

  ## 方案与验证

  技术团队结合工况（长期振动、温度循环 -40~85℃、耐电解液介质）选型 **ABRO 8800 双组分环氧结构胶**，
  并以点焊 + 结构粘接的混合连接方式落地：

  1. 表面处理：铝型材阳极氧化面做脱脂 + 打磨活化
  2. 涂布：间隙控制在 0.5–1.0 mm，保证胶层连续无缺胶
  3. 固化：室温 24h 初固，60℃ / 30min 加速后达到最终强度

  ## 价值

  结构粘接替代部分焊缝后，壳体在保持密封等级的同时实现了减重与工序精简，
  为后续电池包的平台化设计提供了可复用的连接方案。

# ── 英文内容（T12）──
titleEn: 'Structural Bonding of EV Battery Pack Housing'
excerptEn: |
  Two-component epoxy structural adhesive replaces selected welds and mechanical fasteners, improving sealing, fatigue life and weight efficiency of the battery pack housing.
challengeEn: |
  The lower housing and CFRP upper cover were assembled by aluminium profile welding, which caused heat distortion, poor sealing and high process energy consumption — while still needing to satisfy thermal conduction, insulation and long-term vibration reliability.
solutionEn: |
  ABRO 8800 two-component epoxy structural adhesive was used for bonding profiles to the cover, combined with spot-weld positioning. Bond line thickness was tuned to absorb assembly tolerance, and room-temperature cure produced a continuous impact- and oil-resistant layer serving both sealing and structural load paths.
resultEn: |
  Two assembly operations were eliminated, housing gas-tightness pass rate rose to 99.5%, weight was reduced by about 8%, and the pack passed 3 million cycles of vibration fatigue validation.
bodyEn: |
  ## Background

  In EV battery pack manufacturing, the sealing and structural integrity of the housing (lower box plus upper cover) directly affect battery system safety and lifetime. The customer previously relied on welding plus mechanical fastening, facing several pain points:

  - Welding aluminium alloy to CFRP is difficult and heat input distorts the profiles
  - Sealant application around welds is complex, driving a high gas-tightness rework rate
  - Many assembly steps and high energy consumption, hurting takt time and cost control

  ## Solution and validation

  The technical team selected **ABRO 8800 two-component epoxy structural adhesive** based on the duty cycle (long-term vibration, -40 to 85°C thermal cycling, resistance to electrolyte media) and implemented it as a hybrid joint with spot welding:

  1. Surface treatment: anodised aluminium profiles degreased and abraded for activation
  2. Application: gap controlled at 0.5–1.0 mm to ensure a continuous, void-free bond line
  3. Cure: 24 h room-temperature initial set, then 60°C / 30 min acceleration to final strength

  ## Value

  By replacing selected welds with structural bonding, the housing achieved weight reduction and process simplification while maintaining sealing performance, providing a reusable connection approach for future platform designs.
