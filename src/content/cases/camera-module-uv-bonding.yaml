title: '消费电子摄像头模组精密组装'
excerpt: '以低收缩 UV 固化胶实现摄像头模组镜筒与玻璃盖板的快速定位与密封，兼顾光学透明与产线节拍。'
published: true
featured: true
scenario: 'electronics'
client: '某消费电子模组代工厂'
challenge: |
  摄像头模组组装对位置精度要求极高（微米级），传统热固化胶收缩率大、固化时间长，
  易造成光学元件位移与产线节拍瓶颈；同时需要胶层高透光、无雾化。
solution: |
  采用 TAC UV-3200 紫外光固化胶，配合 365–405 nm 点光源在数秒内完成初固，
  低收缩配方抑制定位漂移，高透光率保证光学性能；UV 后辅以湿气二次固化解决阴影区。
result: |
  单件固化时间由 60s 降至 5s，产线节拍提升约 3 倍，
  模组定位良率由 96% 提升至 99.2%，并通过高低温循环与跌落可靠性测试。
products:
  - uv-bond-3200
body: |
  ## 背景

  摄像头模组由镜筒、镜片、玻璃盖板与金属中框等精密件构成，组装既要保证**微米级定位精度**，
  又要满足**量产节拍**。该客户原使用热固化胶，存在固化慢、收缩位移与能耗高等问题。

  ## 方案

  选用 **TAC UV-3200 紫外光固化胶**，对齐工艺要点：

  - 点胶量精确控制（0.02–0.5 mm 胶层），避免溢胶污染光学面
  - 365–405 nm UV 点光源，数秒初固，支持线上即时流转
  - 低收缩、高透光配方，保证成像无雾化、无位移
  - 阴影区域辅以湿气二次固化，确保整体强度

  ## 价值

  UV 固化把单件固化时间从约 60s 压缩到 5s，显著提升节拍；同时低收缩特性把定位良率
  推到 99% 以上，帮助客户在微型化模组上获得稳定的量产良率。
