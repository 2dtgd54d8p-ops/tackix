title: '新能源汽车电控模块导热灌封'
excerpt: '以导热环氧灌封胶替代导热硅脂与机械固定方案，降低功率器件结温、提升模块可靠性与防护等级。'
published: true
featured: true
scenario: 'newenergy'
client: '某新能源汽车电控系统供应商'
challenge: |
  电控模块中的 IGBT 功率器件在持续大电流工况下发热剧烈，原导热硅脂方案在高温下
  存在泵出与干涸风险，长期使用导致接触热阻上升、器件结温过高而提前失效。
solution: |
  采用 TAC EP-550 导热环氧灌封胶进行整体灌封，胶层同时承担导热、绝缘与结构固定三重作用，
  通过真空脱泡消除气泡以降低局部热阻。
result: |
  器件结温下降约 18℃，通过 1000 次温度循环与振动测试，
  模块防护等级提升至 IP67，售后失效返修率明显下降。
products:
  - epoxy-thermal-550
  - epoxy-structural-8800
body: |
  ## 背景

  新能源汽车电控模块内的 IGBT 功率器件是整车电驱系统的核心，其结温直接影响寿命与
  安全。传统导热硅脂在长期高温与振动工况下会出现泵出、干涸，导致接触热阻上升。

  ## 方案与验证

  选型 **TAC EP-550 导热环氧灌封胶**，兼顾导热、绝缘与结构固定：

  1. 表面处理：基板与器件底面做脱脂与干化处理
  2. 灌封：控制胶层厚度，必要时增设散热路径降低热阻
  3. 气泡控制：真空脱泡去除内部空隙，避免局部热点
  4. 固化：室温固化后进行 1000 次温度循环与振动可靠性验证

  ## 价值

  灌封胶替代硅脂后，热界面稳定性大幅提升，结温显著下降；同时胶层提供 IP67 级防护，
  兼顾散热与密封，减少了模块的故障返修。

# ── 英文内容（T12）──
titleEn: 'Thermally Conductive Potting for EV Control Modules'
excerptEn: |
  Thermally conductive epoxy potting replaces thermal grease and mechanical fixation, lowering power-device junction temperature and improving module reliability and protection.
challengeEn: |
  IGBT power devices in the control module generate substantial heat under sustained high current. The original thermal grease approach suffers pump-out and drying at high temperature, causing rising contact thermal resistance, excessive junction temperature and premature failure.
solutionEn: |
  TAC EP-550 thermally conductive epoxy was used for full potting, with the adhesive layer simultaneously performing heat transfer, insulation and structural fixing. Vacuum degassing eliminated bubbles to reduce local thermal resistance.
resultEn: |
  Device junction temperature dropped about 18°C, passing 1,000 thermal cycles and vibration testing. Module protection reached IP67, with a marked reduction in field failure and rework.
bodyEn: |
  ## Background

  IGBT power devices are the core of an EV electric drive system, and their junction temperature directly determines lifetime and safety. Conventional thermal grease can pump out and dry under prolonged high temperature and vibration, raising contact thermal resistance.

  ## Solution and validation

  **TAC EP-550 thermally conductive epoxy** was selected to combine thermal conduction, insulation and structural fixing:

  1. Surface treatment: substrate and device base degreased and dried
  2. Potting: bond line thickness controlled, with spreading paths added where needed to reduce thermal resistance
  3. Void control: vacuum degassing to remove internal voids and avoid local hot spots
  4. Cure: room-temperature cure followed by 1,000 thermal cycles and vibration reliability validation

  ## Value

  Replacing grease with potting compound substantially improved thermal interface stability and reduced junction temperature. At the same time the bond line provides IP67-level protection, combining heat transfer and sealing to reduce module failures and rework.
