title: '工业设备金属框架结构装配'
excerpt: '以双组分环氧结构胶替代焊接进行金属框架装配，消除焊接变形与热影响区，简化工艺并提升装配效率。'
published: true
featured: false
scenario: 'general'
client: '某工业自动化设备制造商'
challenge: |
  设备框架由多块钢板焊接拼装而成，焊接高温易导致框架变形、应力集中，且需后续机加工
  校正；焊接烟尘与工序繁琐也推高了制造成本与周期。
solution: |
  采用 TAC 8800 双组分环氧结构胶进行定位粘接，配合夹具控制装配精度；
  免焊接工艺避免热变形，胶层连续密封并可吸收应力。
result: |
  装配工序由 8 道减至 4 道，框架平面度由 0.8mm 提升至 0.2mm，
  制造成本下降约 12%，且后续无需焊接返修。
products:
  - epoxy-structural-8800
body: |
  ## 背景

  工业自动化设备框架以钢板焊接拼装为主，焊接过程带来热变形、应力集中与后续校正
  工时，同时焊接环境粉尘与工序繁琐制约产能。

  ## 方案与验证

  选型 **TAC 8800 双组分环氧结构胶**替代焊接实现结构连接：

  1. 表面处理：钢板除锈、脱脂并打磨活化，保证粘接面洁净
  2. 定位装配：使用夹具控制各板件相对位置与间隙
  3. 涂布粘接：间隙控制在 0.3–1.0 mm，确保胶层连续饱满
  4. 固化：室温固化，必要时 60℃ 加速固化达到最终强度

  ## 价值

  结构粘接替代焊接彻底消除了热变形与应力集中问题，框架精度显著提升，
  同时减少了焊接与机加工校正工序，缩短制造周期并降低成本。

# ── 英文内容（T12）──
titleEn: 'Structural Assembly of Industrial Equipment Metal Frames'
excerptEn: |
  Two-component epoxy structural adhesive replaces welding for metal frame assembly, eliminating heat distortion and simplifying the process.
challengeEn: |
  Equipment frames were welded from steel plates, where weld heat causes distortion and stress concentration, followed by corrective machining. Weld fumes and process complexity also raised cost and lead time.
solutionEn: |
  TAC 8800 two-component epoxy structural adhesive was used for positional bonding with fixtures controlling assembly accuracy. The weld-free process avoids heat distortion, and the continuous bond line seals while absorbing stress.
resultEn: |
  Assembly steps reduced from 8 to 4, frame flatness improved from 0.8 mm to 0.2 mm, manufacturing cost fell about 12%, and weld rework was eliminated.
bodyEn: |
  ## Background

  Industrial automation equipment frames were primarily welded from steel plate. Welding brought heat distortion, stress concentration and subsequent corrective machining time, while dust and process complexity constrained capacity.

  ## Solution and validation

  **TAC 8800 two-component epoxy structural adhesive** was selected to replace welding for structural connection:

  1. Surface treatment: steel derusted, degreased and abraded to guarantee a clean bonding surface
  2. Positioning: fixtures used to control the relative position and gap of each plate
  3. Application: gap controlled at 0.3–1.0 mm to ensure a continuous, full bond line
  4. Cure: room-temperature cure, with 60°C acceleration where needed to reach final strength

  ## Value

  Structural bonding replaced welding, completely eliminating heat distortion and stress concentration while improving frame precision. Weld and corrective-machining steps were reduced, shortening manufacturing cycle time and lowering cost.
