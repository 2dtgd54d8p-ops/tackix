title: '一次性输液器组件 UV 粘接'
excerpt: '以医疗级低气味 UV 固化胶替代瞬干胶装配，消除白化与单体残留，满足医疗耗材洁净与生物相容要求。'
published: true
featured: true
scenario: 'medical'
client: '某一次性医疗器械耗材制造商'
challenge: |
  输液器组件的管路与接头装配需满足医疗级生物相容性与洁净度要求。原瞬干胶方案存在
  固化白化、单体残留气味等问题，且在潮湿环境下易出现粘接强度衰减，影响产品合规。
solution: |
  采用 TAC UV-3600 医疗级 UV 固化胶配合 UV 点照固化，实现低气味、无白化的高洁净粘接；
  胶层满足低迁移要求，可耐受医疗灭菌处理。
result: |
  产品通过 ISO 10993 生物相容性测试与灭菌验证，粘接强度在湿热老化后保持率超 90%，
  胶缝无白化与异味，客户顺利通过欧盟 MDR 申报。
products:
  - uv-medical-3600
  - aa-instant-510
body: |
  ## 背景

  一次性输液器等产品需在无菌状态下使用并长期接触体液，对粘接体系的生物相容性、
  洁净度与可靠性均有严格要求。该客户原用瞬干胶方案，面临白化与单体残留的合规风险。

  ## 方案与验证

  选型 **TAC UV-3600 医疗级 UV 固化胶**，对齐医疗行业要求：

  1. 低气味、低迁移配方，无溶剂残留与刺激性单体
  2. UV 快速固化，适配自动化装配产线
  3. 耐医疗灭菌（环氧乙烷/辐照）处理
  4. 验证：进行生物相容性、湿热老化与灭菌后强度保持测试

  ## 价值

  UV 固化胶方案消除了白化与异味问题，胶缝外观洁净，满足医疗级生物相容性要求，
  帮助客户顺利完成严苛的医疗器械法规申报。

# ── 英文内容（T12）──
titleEn: 'UV Bonding for Disposable IV Infusion Set Components'
excerptEn: |
  Medical-grade low-odour UV adhesive replaces cyanoacrylate assembly, eliminating whitening and monomer residue to meet cleanliness and biocompatibility requirements.
challengeEn: |
  IV set tubing and connector assembly must satisfy medical-grade biocompatibility and cleanliness requirements. The original cyanoacrylate approach caused adhesive whitening and monomer odour, with bond strength degrading in humid conditions and affecting regulatory compliance.
solutionEn: |
  TAC UV-3600 medical-grade UV adhesive was used with UV point curing, delivering low-odour, non-whitening, high-cleanliness bonding. The bond line meets low-migration requirements and withstands medical sterilisation.
resultEn: |
  The product passed ISO 10993 biocompatibility testing and sterilisation validation, with over 90% bond strength retained after humidity and heat ageing. Bond lines showed no whitening or odour, enabling successful EU MDR filing.
bodyEn: |
  ## Background

  Disposable infusion products are used sterile and in prolonged contact with bodily fluids, placing strict demands on biocompatibility, cleanliness and reliability of the bonding system. The customer originally used an instant adhesive and faced whitening and monomer residue compliance risks.

  ## Solution and validation

  **TAC UV-3600 medical-grade UV adhesive** was specified against medical industry requirements:

  1. Low-odour, low-migration formulation with no solvent residue or irritating monomers
  2. Fast UV cure compatible with automated assembly lines
  3. Resistance to medical sterilisation (EtO / gamma)
  4. Validation: biocompatibility, humidity-heat ageing and post-sterilisation strength retention testing

  ## Value

  The UV adhesive solution eliminated whitening and odour issues, delivering clean bond lines that meet medical biocompatibility requirements and helped the customer complete stringent medical device regulatory filing.
