title: '电子封装从环氧灌封到 UV 点胶：导热与可靠性如何兼得'
excerpt: '电子模块封装如何在导热、绝缘、粘接强度与工艺节拍之间取舍？本文梳理环氧灌封与 UV 点胶的选型边界。'
publishedAt: '2026-10-08'
published: true
featured: true
category: 'tech'
