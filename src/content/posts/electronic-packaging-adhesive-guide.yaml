scenario: 'electronics'
stage: 'consideration'
faq:
  - question: '导热灌封胶和普通环氧胶有什么区别？'
    answer: 核心差异在导热填料。普通环氧导热系数通常仅 0.2–0.5 W/m·K，导热灌封胶通过填充氮化铝、氧化铝或金刚石等导热填料可达 1–3 W/m·K，能显著降低器件与散热基板间的热阻。同时灌封胶多为低收缩、低离子残留配方，以保护器件免受应力与湿气影响。
  - question: '灌封后会影响光学件或传感器性能吗？'
    answer: 需关注胶层的气泡与折射率。低应力低收缩配方可避免应力损伤；透明件的光学应用则应选择光学级胶并控制气泡，必要时 UV 固化可缩短胶层在腔体内的流动时间，减少沉降与气泡。
  - question: 'UV 固化胶的阴影区怎么办？'
    answer: UV 固化依赖光线穿透，遮挡处无法完全固化。常见做法是采用「UV + 湿气」复合固化体系：先 UV 快速定位，再通过后续湿气固化完成阴影区交联，从而兼顾节拍与整体强度。
  - question: '电子封装选胶时，阻燃等级重要吗？'
    answer: 非常重要，尤其是消费电子与汽车电子。UL94 V-0 是常见要求，材料需具备阻燃认证并按指定厚度评级。汽车电子通常还需关注 AEC-Q 相关的可靠性验证要求。
body: |
  ## 电子封装的核心矛盾

  电子模块封装本质上是在**多个相互冲突的目标**之间找平衡：

  - **导热**：要尽快把热量从芯片带走，否则结温上升直接缩短寿命
  - **绝缘**：高功率器件需要电气隔离
  - **粘接强度**：器件不能在振动与温度循环中脱落
  - **低应力**：胶层收缩不能损伤芯片与焊点
  - **工艺节拍**：产线不会为等待固化而停线

  单一性能强的产品往往顾此失彼，因此选型的关键在于**明确当前工段的矛盾主次**。

  ## 路线一：环氧导热灌封——功率与散热的主力

  导热环氧灌封胶是功率器件（IGBT、LED、功率模块）的主流选择。典型如
  [TAC EP-550 导热环氧灌封胶](/products/epoxy-thermal-550)，导热系数约 1.5 W/m·K，
  兼顾绝缘与结构固定。

  ### 适用特征

  - 发热功率大、需要持续导出热量（车规电驱、充电桩、光伏逆变）
  - 需要同时实现「散热 + 绝缘 + 结构固定」三重作用
  - 器件形状复杂、需整体浇注填充

  ### 工艺要点

  1. **干化与清洁**：基板与器件底面必须干燥洁净，否则气泡与水汽会显著拉高热阻
  2. **真空脱泡**：内部气泡是局部热点的根源
  3. **控制胶层厚度**：过厚增加热阻与成本，过薄难覆盖；必要时增设散热路径
  4. **固化条件**：室温固化或按规格加热加速，避免过温损伤器件

  ## 路线二：UV 点胶——精密装配的节拍解

  UV 固化胶在数秒内完成固化，适合高速自动化产线与精密定位场景。典型如
  [TAC UV-3600 医疗级 UV 固化胶](/products/uv-medical-3600)（低气味低迁移）、
  [TAC UV-3200](/products/uv-bond-3200)（高透光、低收缩）。

  ### 适用特征

  - 精密小件定位（摄像头模组、医疗耗材组装）
  - 产线节拍敏感，希望「涂完即走」
  - 需要无溶剂、低气味，或需透过光线做深层固化

  ### 阴影区问题必须解决

  UV 依赖光线穿透，被遮挡处无法完全固化，因此**几乎所有工程级 UV 胶都采用复合固化体系**：
  先用 UV 完成快速初固与定位，再利用湿气或热固化完成阴影区的交联。
  工艺上需根据件体结构确认阴影区范围，并保证后续固化条件可达。

  ## 两条路线的对比

  | 维度 | 环氧导热灌封 | UV 点胶 |
  |---|---|---|
  | 固化速度 | 小时级（室温）或分钟级（加热） | 秒级 |
  | 导热能力 | 强（1–3 W/m·K） | 弱，多为导热界面辅助 |
  | 电气绝缘 | 优 | 良 |
  | 阴影区 | 无此问题 | 需复合固化 |
  | 胶层厚度 | 较厚（浇注） | 薄（点胶） |
  | 典型场景 | 功率模块、储能、电驱 | 精密模组、医疗、传感器 |

  ## 实践建议：从「热」倒推选型

  1. **先算结温预算**：明确器件允许的最高结温，倒推界面热阻上限
  2. **再看热源分布**：集中发热（如单颗 IGBT）选灌封；分散精密发热（如传感器）选点胶
  3. **确认绝缘与固定需求**：需要同时完成结构固定时，灌封胶更合适
  4. **评估工艺窗口**：与产线节拍、固化设备（日光灯、UV 光源、热流道）匹配
  5. **用可靠性验证闭环**：温度循环、湿热、跌落/振动验证后再量产固化工艺

  > 若需要针对具体器件做选型评估，欢迎把器件型号、功耗、封装尺寸与工作温度范围
  > 发给我们，技术工程师可给出具体型号与工艺建议；也可先在[选型工具](/selector)
  > 按场景与基材筛选候选产品。

