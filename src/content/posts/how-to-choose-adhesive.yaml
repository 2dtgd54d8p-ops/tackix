scenario: 'general'
stage: 'awareness'
faq:
  - question: '环氧胶和聚氨酯胶哪个更牢固？'
    answer: 没有绝对优劣。环氧胶刚性强、耐温高、耐化学介质，适合静态承重与刚性结构；聚氨酯胶弹性高、抗冲击与抗剥离，适合有热胀冷缩位移、振动或需吸收形变的接缝。选择取决于工况是「刚性稳定」还是「动态变形」。
  - question: '硅酮密封胶能当结构胶用吗？'
    answer: 不建议。建筑与幕墙领域需区分「结构硅酮密封胶」与「耐候密封胶」。用于承重结构粘接时必须选用具备结构认证（如 ASTM C1184 / EN 12100）的产品，并按厂家规定的设计尺寸施工，普通耐候胶仅适合非承重接缝。
  - question: '瞬干胶（氰基丙烯酸酯）能大面积使用吗？'
    answer: 不适合。瞬干胶脆性高、耐温低、且易被白化，多用于小面积快速固定，不适合大面积承重结构粘接或长期高温工况。
  - question: '为什么粘接前一定要做表面处理？'
    answer: 胶粘强度主要取决于界面结合而非胶本身强度。油污、灰尘、氧化层和脱模剂会隔绝胶与基材直接接触，导致界面结合力大幅下降，甚至出现「假粘」（外观贴合、一剥离即脱）。
body: |
  ## 为什么选型比选品牌更重要

  很多工程师在选胶时习惯先看品牌与价格，但真正决定成败的其实是**工况与胶的化学体系是否匹配**。
  同一款胶用对了是「可靠连接」，用错了就是「返工成本」。本文给出一套可复用的选型逻辑。

  ## 第一步：先看工况，而不是先看胶

  选型前必须明确四个关键问题，这决定了后续的筛选方向：

  1. **被粘基材是什么？** 金属、塑料、玻璃、橡胶的表面能差异巨大，决定了能否直接粘接
  2. **是否需要承受载荷？** 承重结构与电子封装用的完全是两类产品
  3. **有没有位移与形变？** 热胀冷缩是选型的隐形杀手
  4. **环境条件如何？** 温度、湿度、化学介质、紫外线

  ## 第二步：按化学体系建立认知

  ### 环氧树脂胶（Epoxy）
  刚性强、收缩小、耐化学介质优异，长期使用温度可超 120℃。缺点是脆性大，承受冲击与剥离时易开裂。
  **适用**：金属结构粘接、复合材料连接、电子灌封、汽车结构件。

  ### 聚氨酯胶（Polyurethane）
  弹性好、抗冲击与抗剥离强，能随基材同步变形。耐候与耐 UV 表现优异，但强度上限低于环氧。
  **适用**：车身蒙皮、幕墙接缝、振动工况、动态位移。

  ### 硅酮密封胶（Silicone）
  耐候性最好，长期户外不粉化、不龟裂，位移能力可达 ±25%。属于「密封」属性，结构粘接需选用结构认证型号。
  **适用**：幕墙、门窗、石材接缝、防水密封。

  ### UV 固化胶（UV Adhesive）
  数秒固化、无挥发、胶层清晰无雾化，但对光线遮挡处无法固化（阴影区），通常辅以湿气二次固化。
  **适用**：消费电子组装、医疗器械、透明件点胶。

  ### 瞬干胶（Cyanoacrylate / 瞬干）
  秒级固化、无色透明，但脆性高、耐温低、长期易白化。
  **适用**：小面积快速固定、精密补修。

  ### 厌氧胶（Anaerobic）
  隔绝空气自动固化，形成高强度防松胶层；可按强度分为可拆卸型与永久锁固型。
  **适用**：螺纹紧固件防松、微孔密封防漏。

  ### 丙烯酸酯胶（Acrylic）
  粘接快、部分基材可免底涂，低气味。
  **适用**：塑料外壳装配、家电饰条、非承力快速固定。

  ### 热熔胶（Hot Melt）
  加热熔融即粘、无溶剂、适合自动化，成本经济；耐热与耐候有限。
  **适用**：纸箱封箱、木工组装、轻工品粘接。

  ## 第三步：用「位移能力」排除错误选项

  这是最容易被忽略、却最容易导致后期开裂的判断点。当接缝存在温度变形或结构位移时：

  - 刚性胶（环氧、瞬干胶）会因无法跟随形变而**开裂脱粘**
  - 弹性胶（聚氨酯、硅酮）能通过弹性变形**吸收位移**

  > 判断口诀：**接缝会动，就要用会「让」的胶**。

  ## 第四步：别忽视表面处理

  胶粘强度主要来自界面结合，而非胶本身的强度。油污、灰尘、氧化层、脱模剂会隔绝胶与基材直接接触，
  导致界面结合力急剧下降，表现为「外观贴合、一剥离即脱」的假粘现象。

  常见处理方式：

  - **金属**：除锈 → 脱脂 → 打磨活化，铝材阳极氧化面建议做活化处理
  - **塑料**：脱脂 → 必要时电晕/等离子活化（PE、PP 等低表面能材料必须处理）
  - **玻璃/石材**：清洁 → 必要时涂底涂剂
  - **橡胶**：避免使用可能溶胀或增塑的溶剂清洗

  ## 快速决策表

  | 工况特征 | 优先考虑 |
  |---|---|
  | 静态承重、高温、刚性 | 环氧胶 |
  | 有位移/振动、需抗冲击 | 聚氨酯胶 |
  | 户外长期、接缝变形 | 硅酮密封胶 |
  | 小面积、秒级固定 | 瞬干胶 |
  | 螺纹防松、密封防漏 | 厌氧胶 |
  | 透明件/快速产线/无挥发 | UV 固化胶 |
  | 包装封箱、木工、自动化 | 热熔胶 |

  > 拿不准时，可先在[选型工具](/selector)按场景、固化方式与基材做初步筛选，再由我方工程师结合工况给出建议。

  ## 常见误区

  1. **「越强越好」** —— 强度过高反而可能因热膨胀系数不匹配而开裂
  2. **「免处理也能粘」** —— 表面处理带来的强度提升往往超过换一款更贵的胶
  3. **「混合比例差不多就行」** —— 双组分胶的混合比例直接影响交联密度与最终性能

